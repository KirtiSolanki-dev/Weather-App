<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful weather app</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <h1 class="app-title">
            Weather App
        </h1>

        <!-- search container -->
        <div class="search-container">
            <input type="text" id="city-input" placeholder="Enter city name ">

            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>



        <!-- loading and error handling -->

        <p class="loading" id="loading"></p>
        <p class="error-message" id="error-message"></p>



        <!-- weather   -->

        <div class="weather-card">

            <img   src="https://cdn.weatherapi.com/weather/64x64/day/113.png" alt="Weather Icon" class="weather-icon" id="weather-icon">


            <!-- display -->
            <div class="weather-info">

                <h2 class="city-name" id="city-name">
                    Mumbai
                </h2>

                <div class="temp" id="temp">
                    25°C
                </div>

                <p class="description" id="description">
                    Mostly Sunny
                </p>
            </div>


            <!-- weather details -->
            <div class="cards">

                <div class="detail-card">
                    <i class="fa-solid fa-droplet"></i>
                    <p>Humidity </p>
                    <span id="humidity">25%</span>
                </div>


                <div class="detail-card">
                    <i class="fa-solid fa-wind"></i>
                    <p>Wind</p>
                    <span id="wind-speed">25kmph</span>
                </div>

            </div>
        </div>
    </div>
<script src="script.js"></script>
</body>

</html>
